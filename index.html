<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <input id="place" class="user_input" placeholder="Place...">

    <br><br>
    <button id="submit" class="btn">Search</button>

    <div class="container">

        <div id="myBox1">
            <br>
            <p id="placename"></p>
            <br>
            <p id="state"></p>
            <br>
            <p id="showLat"></p>
            <br>
            <p id="showLong"></p>

        </div>

        <div id="myBox2">

            <p id="date"></p>
            <br>
            <p id="max_temp"></p>
            <br>
            <p id="min_temp"></p>
            <br>
            <p id="rain_chance"></p>
            <br>
            <p id="rain_amt"></p>
        </div>

        <script src="index.js"></script>



    </div>
</body>

</html>
